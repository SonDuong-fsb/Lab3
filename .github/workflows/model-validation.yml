name: Model Validation

on:
  push:
    paths:
      - "models/**"
      - "scripts/**"
      - "app/model.py"
      - "tests/model/**"
      - "requirements.txt"
  workflow_dispatch:

concurrency:
  group: model-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-model:
    name: Validate Model
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache MovieLens dataset
        uses: actions/cache@v4
        with:
          path: ~/.surprise_data
          key: ${{ runner.os }}-movielens-100k

      - name: Install dependencies
        run: |
          bash scripts/install_requirements.sh
          pip install -r requirements-dev.txt

      - name: Train model
        run: python scripts/train_model.py

      - name: Validate model behaviour and performance
        run: pytest tests/model/ tests/data/ -v
