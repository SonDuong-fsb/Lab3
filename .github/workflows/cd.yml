name: CD Pipeline

on:
  push:
    tags:
      - "v*"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"
  IMAGE_NAME: movie-rating-api

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache MovieLens dataset
        uses: actions/cache@v4
        with:
          path: ~/.surprise_data
          key: ${{ runner.os }}-movielens-100k

      - name: Install dependencies
        run: |
          bash scripts/install_requirements.sh
          pip install -r requirements-dev.txt

      - name: Train model
        run: python scripts/train_model.py

      - name: Run release gate tests
        run: pytest tests/ -v --cov=app --cov-fail-under=80

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true

  smoke-test:
    name: Smoke Test Published Image
    runs-on: ubuntu-latest
    needs: [build-and-push]
    timeout-minutes: 10

    steps:
      - name: Pull published image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Start container
        run: >
          docker run -d -p 8000:8000 --name ${{ env.IMAGE_NAME }}
          ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Verify health and prediction
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > health.json; then
              break
            fi
            sleep 2
          done
          cat health.json
          python3 -c "import json; assert json.load(open('health.json'))['model_loaded'] is True"
          curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"user_id": "196", "movie_id": "242"}'

      - name: Print container logs on failure
        if: failure()
        run: docker logs ${{ env.IMAGE_NAME }}

      - name: Stop container
        if: always()
        run: docker rm -f ${{ env.IMAGE_NAME }}
